name: Build APK Android

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout codice
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Installa dipendenze
        run: npm install

      - name: Aggiungi piattaforma Android
        run: npx cap add android

      - name: Sincronizza web app
        run: npx cap sync android

      - name: Compila APK
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: Rinomina APK
        run: |
          mv android/app/build/outputs/apk/debug/app-debug.apk \
             android/app/build/outputs/apk/debug/FileManager.apk

      - name: Carica APK come artifact
        uses: actions/upload-artifact@v4
        with:
          name: FileManager-APK
          path: android/app/build/outputs/apk/debug/FileManager.apk
          retention-days: 30
