name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Crea progetto Flutter base
        run: |
          flutter create --org com.example --project-name file_manager --platforms=android .

      - name: Installa dipendenze
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Carica APK come artifact
        uses: actions/upload-artifact@v4
        with:
          name: file-manager-apk
          path: build/app/outputs/flutter-apk/app-release.apk
