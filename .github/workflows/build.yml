name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Backup file personalizzati
        run: |
          mkdir -p /tmp/backup
          cp pubspec.yaml /tmp/backup/pubspec.yaml
          cp lib/main.dart /tmp/backup/main.dart
          cp android/app/src/main/AndroidManifest.xml /tmp/backup/AndroidManifest.xml

      - name: Crea progetto Flutter base
        run: |
          flutter create --org com.example --project-name file_manager --platforms=android .

      - name: Ripristina file personalizzati
        run: |
          cp /tmp/backup/pubspec.yaml pubspec.yaml
          cp /tmp/backup/main.dart lib/main.dart
          cp /tmp/backup/AndroidManifest.xml android/app/src/main/AndroidManifest.xml

      - name: Aggiorna Kotlin alla versione 1.9.24
        run: |
          # Aggiorna ext.kotlin_version in build.gradle
          sed -i "s/ext.kotlin_version = .*/ext.kotlin_version = '1.9.24'/" android/build.gradle || true
          
          # Aggiorna il plugin Kotlin in settings.gradle
          sed -i "s/id \"org.jetbrains.kotlin.android\" version \".*\"/id \"org.jetbrains.kotlin.android\" version \"1.9.24\"/" android/settings.gradle || true
          
          echo "--- android/build.gradle ---"
          grep -n "kotlin" android/build.gradle || true
          echo "--- android/settings.gradle ---"
          grep -n "kotlin" android/settings.gradle || true

      - name: Installa dipendenze
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Carica APK come artifact
        uses: actions/upload-artifact@v4
        with:
          name: file-manager-apk
          path: build/app/outputs/flutter-apk/app-release.apk
