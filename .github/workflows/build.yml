name: Build APK Android

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout codice
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'
          log-accepted-android-sdk-licenses: false

      - name: Installa dipendenze
        run: npm install

      - name: Aggiungi piattaforma Android
        run: npx cap add android

      - name: Sincronizza web app
        run: npx cap sync android

      - name: Copia i plugin nativi (DOPO sync!)
        run: |
          mkdir -p android/app/src/main/java/com/filemanager/app
          cp android_plugins/FileReaderPlugin.java android/app/src/main/java/com/filemanager/app/
          cp android_plugins/MainActivity.java     android/app/src/main/java/com/filemanager/app/
          echo "--- File nella cartella java ---"
          ls -la android/app/src/main/java/com/filemanager/app/
          echo "--- Contenuto MainActivity.java ---"
          cat android/app/src/main/java/com/filemanager/app/MainActivity.java

      - name: Aggiungi permessi al manifest
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          sed -i 's|</manifest>|  <uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />\n  <uses-permission android:name="android.permission.READ_MEDIA_VIDEO" />\n  <uses-permission android:name="android.permission.READ_MEDIA_AUDIO" />\n  <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />\n  <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="29" />\n  <uses-permission android:name="android.permission.MANAGE_EXTERNAL_STORAGE" />\n</manifest>|' $MANIFEST
          echo "--- Manifest ---"
          cat $MANIFEST

      - name: Compila APK
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: Rinomina APK
        run: |
          mv android/app/build/outputs/apk/debug/app-debug.apk \
             android/app/build/outputs/apk/debug/FileManager.apk

      - name: Carica APK come artifact
        uses: actions/upload-artifact@v4
        with:
          name: FileManager-APK
          path: android/app/build/outputs/apk/debug/FileManager.apk
          retention-days: 30
