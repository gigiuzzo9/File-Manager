<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>File Manager</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- RIGA 1: Ricerca + Impostazioni -->
  <header class="topbar">
    <input type="text" id="search" placeholder="Cerca file o cartelle...">
    <button id="settings-btn" class="icon-btn" data-icon="settings"></button>
  </header>

  <!-- RIGA 2: Categorie -->
  <section class="categories">
    <button class="cat-btn" data-cat="images">   <span data-icon="images"></span>   <span>Immagini</span></button>
    <button class="cat-btn" data-cat="audio">    <span data-icon="audio"></span>    <span>Audio</span></button>
    <button class="cat-btn" data-cat="video">    <span data-icon="video"></span>    <span>Video</span></button>
    <button class="cat-btn" data-cat="documents"><span data-icon="documents"></span><span>Documenti</span></button>
  </section>

  <!-- RIGA 3: Memorie -->
  <section id="storages" class="storages"></section>

  <!-- RIGA 4: Azioni -->
  <section class="actions">
    <button id="add-folder-btn" class="icon-btn" aria-label="Aggiungi cartella">
      <span data-icon="folderAdd"></span>
    </button>
    <select id="sort-select">
      <option value="name">Nome</option>
      <option value="date">Data</option>
      <option value="size">Dimensione</option>
      <option value="type">Tipo</option>
    </select>
    <button id="view-toggle" class="icon-btn" data-icon="list"></button>
  </section>

  <!-- PATH corrente -->
  <div id="path-bar" class="path-bar">/</div>

  <!-- LISTA FILE -->
  <main id="file-list" class="file-list list-view">
    <div class="loading">Caricamento...</div>
  </main>

  <!-- MENU CONTESTUALE -->
  <div id="context-menu" class="context-menu hidden">
    <button data-action="open">Apri</button>
    <button data-action="copy">Copia</button>
    <button data-action="cut">Taglia</button>
    <button data-action="paste">Incolla</button>
    <button data-action="move">Sposta</button>
    <button data-action="rename">Rinomina</button>
    <button data-action="share">Condividi</button>
    <button data-action="delete">Elimina</button>
    <button data-action="info">Proprietà</button>
  </div>

  <!-- OVERLAY impostazioni -->
  <div id="settings-overlay" class="overlay hidden"></div>

  <!-- PANNELLO IMPOSTAZIONI -->
  <aside id="settings-panel" class="settings-panel hidden">
    <header class="settings-header">
      <h2>Impostazioni</h2>
      <button id="settings-close" class="icon-btn">✕</button>
    </header>

    <section class="settings-group">
      <h3>Aspetto</h3>
      <div class="setting-row">
        <label>Tema</label>
        <select id="set-theme">
          <option value="light">Chiaro</option>
          <option value="dark">Scuro</option>
          <option value="auto">Automatico</option>
        </select>
      </div>
      <div class="setting-row">
        <label>Colore accento</label>
        <input type="color" id="set-accent" value="#3b82f6">
      </div>
    </section>

    <section class="settings-group">
      <h3>File</h3>
      <div class="setting-row">
        <label>Mostra estensioni file</label>
        <input type="checkbox" id="set-showext" checked>
      </div>
      <div class="setting-row">
        <label>Conferma eliminazione</label>
        <input type="checkbox" id="set-confirmdelete" checked>
      </div>
      <div class="setting-row">
        <label>Cartelle prima dei file</label>
        <input type="checkbox" id="set-foldersfirst" checked>
      </div>
    </section>

    <section class="settings-group">
      <h3>Info</h3>
      <p class="setting-info">File Manager v1.0.0</p>
      <button id="reset-settings" class="btn-secondary">Ripristina impostazioni</button>
    </section>
  </aside>

  <script src="app.js"></script>
</body>
</html>
